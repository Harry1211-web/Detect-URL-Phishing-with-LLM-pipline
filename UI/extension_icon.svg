<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Shield Interior Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Border Glow Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="#0284C7" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Base Dark Disc -->
  <circle cx="256" cy="256" r="224" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.3"/>

  <!-- Shield Body Shadow/Glow -->
  <path d="M 256,120 Q 320,135 380,130 Q 380,260 256,396 Q 132,260 132,130 Q 192,135 256,120 Z" 
        fill="#06B6D4" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Main Shield Body -->
  <path d="M 256,120 Q 320,135 380,130 Q 380,260 256,396 Q 132,260 132,130 Q 192,135 256,120 Z" 
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Inner Shield Trim -->
  <path d="M 256,140 Q 310,152 360,148 Q 360,250 256,370 Q 152,250 152,148 Q 202,152 256,140 Z" 
        fill="none" stroke="#67E8F9" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Radar Arc (Top scan wave) -->
  <path d="M 200,185 A 75,75 0 0,1 312,185" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8"/>
  <path d="M 220,205 A 48,48 0 0,1 292,205" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Checkmark Emblem (Verified Safe) -->
  <path d="M 206,260 L 242,298 L 316,212" 
        fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <path d="M 206,260 L 242,298 L 316,212" 
        fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural AI Nodes on Checkmark -->
  <circle cx="206" cy="260" r="7" fill="#FFFFFF"/>
  <circle cx="206" cy="260" r="4" fill="#06B6D4"/>

  <circle cx="242" cy="298" r="7" fill="#FFFFFF"/>
  <circle cx="242" cy="298" r="4" fill="#06B6D4"/>

  <circle cx="316" cy="212" r="7" fill="#FFFFFF"/>
  <circle cx="316" cy="212" r="4" fill="#06B6D4"/>
</svg>

